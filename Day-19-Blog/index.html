<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Blog UI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">

        <div class="container">

            <a class="navbar-brand" href="#">
                BlogSpace
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Blogs</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <section class="hero">

        <div class="container">

            <h1>Modern Dynamic Blog UI</h1>

            <p>
                A beautiful responsive blog page built using
                HTML, Bootstrap, and JavaScript with dynamic
                rendering functionality.
            </p>


            <div class="search-box">

                <input type="text" id="searchInput" class="search-input" placeholder="Search blog posts..." />

            </div>

        </div>

    </section>


    <section class="blog-section">

        <div class="container">

            <div class="row g-4" id="blogContainer">

            </div>

            <div class="empty" id="emptyState">
                <h3>No Blog Found</h3>
            </div>

        </div>

    </section>


    <footer>
        Day 19 / 21 — Frontend Challenge
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script src="./assets/js/script.js"></script>

</body>

</html>
