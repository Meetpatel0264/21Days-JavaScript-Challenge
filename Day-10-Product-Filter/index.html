<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Cars Showcase</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Luxury Cars Collection</h1>
        <p>Find Your Dream Premium Car</p>
    </div>

    <div class="filter-section">
        <input type="text" id="searchInput" placeholder="Search cars...">

        <select id="brandFilter" title="brandFilter">
            <option value="all">All Brands</option>
            <option value="bmw">BMW</option>
            <option value="audi">Audi</option>
            <option value="mercedes">Mercedes</option>
            <option value="lamborghini">Lamborghini</option>
            <option value="rr">Rolls Royce</option>
        </select>
    </div>

    <div class="cars-container" id="carsContainer"></div>

</div>

<script src="./assets/js/script.js"></script>
</body>
</html>
