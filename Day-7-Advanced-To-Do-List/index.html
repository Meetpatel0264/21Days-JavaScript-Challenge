<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Todo</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/style.css">

</head>

<body>

<div class="todo-box">
    <h2 class="text-center mb-3">Advanced Todo List</h2>

    <div class="input-group mb-2">
        <input type="text" id="todoInput" class="form-control" placeholder="Enter task">
        <button class="btn btn-danger" onclick="addTask()">+</button>
    </div>

    <select id="prioritySelect" class="form-select mb-2" title="Priority">
        <option value="-1">Select Priority</option>
        <option value="1">High</option>
        <option value="2">Medium</option>
        <option value="3">Low</option>
    </select>

    <select id="filterSelect" class="form-select mb-3" onchange="renderTasks()" title="Form-Select">
        <option value="all">All</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
    </select>

    <div id="todoList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script src="./assets/js/index.js"></script>    

</body>
</html>
