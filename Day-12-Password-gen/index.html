<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <div class="card">

        <h4 class="title">Password Generator</h4>

        <div class="password-box mb-3">
            <input type="text" id="password" class="form-control" placeholder="Type or Generate Password">
            <button class="btn copy-btn" onclick="copyPassword()">Copy</button>
        </div>

        <label class="text-white">Length: <span id="lengthValue">12</span></label>
        <input type="range" min="6" max="25" value="12" id="length" class="form-range mb-3">

        <div class="row">
            <div class="col-6">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="uppercase" checked>
                    <label class="text-white">Uppercase</label>
                </div>
            </div>

            <div class="col-6">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="lowercase" checked>
                    <label class="text-white">Lowercase</label>
                </div>
            </div>

            <div class="col-6">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="numbers" checked>
                    <label class="text-white">Numbers</label>
                </div>
            </div>

            <div class="col-6">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="symbols">
                    <label class="text-white">Symbols</label>
                </div>
            </div>
        </div>

        <button class="btn btn-generate w-100 mt-3" onclick="generatePassword()">Generate</button>

        <div class="strength-container">
            <div id="strengthBar" class="strength-bar"></div>
        </div>

        <div class="small-text text-white">Strong password = more security 🔐</div>

    </div>

    <script src="./assets/js/script.js"></script>

</body>

</html>
