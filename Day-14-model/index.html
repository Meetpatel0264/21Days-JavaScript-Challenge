<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Modal UI</title>
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

<div class="wrapper">
    <h1>Modern UI Modal</h1>
    <button id="openModal" class="btn">Launch</button>
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>Welcome</h2>
            <span id="closeModal">&times;</span>
        </div>
        <div class="modal-body">
            <p>Clean modern modal design with smooth UI.</p>
        </div>
        <div class="modal-footer">
            <button id="confirmModal" class="confirm">Continue</button>
        </div>
    </div>
</div>

<script src="./assets/js/script.js"></script>
</body>
</html>
