<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css">

</head>

<body>

    <div class="dashboard">


        <div class="sidebar">

            <div class="logo">Meet</div>

            <ul class="menu">

                <li>
                    <a href="#" class="active">
                        <i class="bi bi-grid-fill"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-bar-chart-fill"></i>
                        <span>Analytics</span>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-cart-fill"></i>
                        <span>Orders</span>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-people-fill"></i>
                        <span>Users</span>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-gear-fill"></i>
                        <span>Settings</span>
                    </a>
                </li>

            </ul>

        </div>


        <div class="main">


            <div class="topbar">

                <div>
                    <h2>Dashboard</h2>
                    <p class="text-secondary">Welcome back, Meet</p>
                </div>

                <div class="d-flex align-items-center gap-3">

                    <input type="text" placeholder="Search..." class="search-box">

                    <div class="profile">
                        <img src="./assets/img/Meet-ujjain-img.jpeg" alt="">
                    </div>

                </div>

            </div>


            <div class="row g-4">

                <div class="col-lg-3 col-md-6">
                    <div class="stats-card">

                        <div class="stats-icon bg1">
                            <i class="bi bi-currency-dollar"></i>
                        </div>

                        <h3 id="revenue">0</h3>
                        <p>Total Revenue</p>

                    </div>
                </div>

                <div class="col-lg-3 col-md-6">
                    <div class="stats-card">

                        <div class="stats-icon bg2">
                            <i class="bi bi-cart-check-fill"></i>
                        </div>

                        <h3 id="orders">0</h3>
                        <p>Total Orders</p>

                    </div>
                </div>

                <div class="col-lg-3 col-md-6">
                    <div class="stats-card">

                        <div class="stats-icon bg3">
                            <i class="bi bi-people-fill"></i>
                        </div>

                        <h3 id="users">0</h3>
                        <p>Active Users</p>

                    </div>
                </div>

                <div class="col-lg-3 col-md-6">
                    <div class="stats-card">

                        <div class="stats-icon bg4">
                            <i class="bi bi-bag-fill"></i>
                        </div>

                        <h3 id="products">0</h3>
                        <p>Total Products</p>

                    </div>
                </div>

            </div>


            <div class="table-section">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4>Recent Orders</h4>

                    <button class="btn btn-info">
                        View All
                    </button>
                </div>

                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>
                            <tr>
                                <th>#ID</th>
                                <th>Customer</th>
                                <th>Product</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="tableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script src="./assets/js/script.js"></script>

</body>

</html>
